services:
  backend:
    build: .
    ports:
      - "8989:8989"
    volumes:
      - bookmark-data:/app/.local

  frontend:
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install -g pnpm && pnpm install && pnpm dev --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  bookmark-data:
